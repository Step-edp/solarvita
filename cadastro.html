<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — SolarVita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <div class="auth-bg"></div>

  <header class="auth-header">
    <div class="container">
      <a href="index.html" class="auth-logo">
        <span>☀</span> SolarVita
      </a>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <span class="auth-badge" id="auth-badge">🏠 Cliente</span>
      <h1 id="auth-title">Cadastro</h1>
      <p class="auth-subtitle" id="auth-subtitle">Preencha os dados para criar sua conta</p>

      <div id="auth-alert" class="auth-alert"></div>

      <form id="cadastro-form" class="auth-form">
        <div class="form-group" id="perfil-group" hidden>
          <label for="perfil">Perfil de acesso</label>
          <select id="perfil" name="perfil">
            <option value="">Selecione seu perfil</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" autocomplete="username" required>
        </div>

        <div id="admin-extra-fields" hidden>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label for="whatsapp">WhatsApp</label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="(00) 00000-0000" maxlength="15" inputmode="tel" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento" autocomplete="bday">
          </div>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="password-toggle">
            <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
            <button type="button" aria-label="Mostrar senha">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmar">Confirmar senha</label>
          <div class="password-toggle">
            <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" autocomplete="new-password" required>
            <button type="button" aria-label="Mostrar senha">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Criar conta</button>
      </form>

      <div class="auth-footer" id="auth-footer">
        Já tem conta? <a id="link-login" href="login.html?tipo=cliente">Faça login</a>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>initCadastroPage();</script>
</body>
</html>
