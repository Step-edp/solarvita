<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro pendente — SolarVita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page pendente-page">
  <div class="auth-bg"></div>

  <header class="auth-header">
    <div class="container">
      <a href="index.html" class="auth-logo">
        <span>☀</span> SolarVita
      </a>
    </div>
  </header>

  <main class="pendente-main">
    <div class="pendente-screen">
      <div class="pendente-icon-wrap">
        <span class="pendente-icon">⏳</span>
      </div>
      <h1>Cadastro pendente de aprovação do administrador</h1>
      <p class="pendente-message">Você será avisado por e-mail sobre a resposta.</p>
      <div class="pendente-actions">
        <a id="link-login" href="login.html?tipo=admin" class="btn btn-primary btn-full">Voltar ao login</a>
        <a href="index.html" class="pendente-link">Ir para o site</a>
      </div>
    </div>
  </main>

  <script>
    const tipo = new URLSearchParams(window.location.search).get('tipo') || 'admin';
    document.getElementById('link-login').href = `login.html?tipo=${tipo}`;
  </script>
</body>
</html>
